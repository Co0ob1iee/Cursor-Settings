name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          npm ci
      - name: Lint
        run: |
          npm run lint || true
      - name: Run tests
        run: |
          npm test || true
      - name: Security scan (example)
        run: |
          echo "Run SCA or secret scan here"
