name: Validate PR Body Contains Prompt

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  require-prompt:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for PROMPT marker
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const hasPrompt = body.includes("PROMPT:") && body.includes("LLM OUTPUT:");
            if (!hasPrompt) {
              core.setFailed("PR body must include PROMPT: and LLM OUTPUT: sections. See .github/PULL_REQUEST_TEMPLATE.md");
            }
